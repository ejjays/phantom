name: Debug SSH
on:
  workflow_dispatch:

jobs:
  ssh-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe VM sshd
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" \
            "hostname; date -u +%H:%M; systemctl is-active a1-hunt; grep -c 'launch attempt' ~/oracle-setup/hunt.log; echo 429:; grep -c '\"status\": 429' ~/oracle-setup/hunt.log; echo 500:; grep -c '\"status\": 500' ~/oracle-setup/hunt.log; echo success:; grep -c SUCCESS ~/oracle-setup/hunt.log; tail -n 3 ~/oracle-setup/hunt.log; sudo journalctl -u sshd --no-pager -n 5 2>/dev/null | tail -5; free -m | head -2"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}