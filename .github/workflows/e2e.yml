name: Mobile E2E (Maestro)

on:
  workflow_dispatch:
    inputs:
      test_url:
        description: Single URL to check (empty = full tier matrix)
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/e2e.yml'
  schedule:
    # nightly full matrix against default branch
    - cron: '30 5 * * *'

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build x86_64 apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install required NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --install "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Tune Gradle memory for CI
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m
          org.gradle.workers.max=4
          EOF

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Guard against platform-pinned bindings
        run: bash scripts/guard-platform-bindings.sh

      - name: Install dependencies (monorepo root)
        run: npm ci

      - name: Hash app sources for apk cache
        id: apphash
        run: echo "hash=${{ hashFiles('mobile/src/**', 'mobile/modules/**', 'mobile/plugins/**', 'mobile/assets/**', 'mobile/app.json', 'mobile/eas.json', 'mobile/package.json', 'package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore e2e apk cache
        id: apkcache
        uses: actions/cache@v4
        with:
          path: mobile/app-e2e.apk
          key: e2e-apk-${{ steps.apphash.outputs.hash }}

      - name: Build x86_64 APK locally with EAS
        if: steps.apkcache.outputs.cache-hit != 'true'
        working-directory: mobile
        env:
          EXPO_PUBLIC_GIPHY_KEY: ${{ secrets.EXPO_PUBLIC_GIPHY_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
          EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_SECRET }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_IG_COOKIE: ${{ secrets.EXPO_PUBLIC_IG_COOKIE }}
        run: |
          eas build --platform android \
            --profile e2e \
            --local \
            --non-interactive \
            --output ./app-e2e.apk

      - name: Upload e2e APK
        uses: actions/upload-artifact@v7
        with:
          name: phantom-e2e-x64-apk
          path: mobile/app-e2e.apk
          retention-days: 7

  maestro-e2e:
    name: Maestro matrix (${{ matrix.shard }}/3)
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      TIER_MODE: ${{ github.event_name == 'pull_request' && 'solid' || 'all' }}
      DISPATCH_URL: ${{ inputs.test_url || '' }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: phantom-e2e-x64-apk
          path: mobile

      # /dev/kvm exists on gh runners but root-only without this rule
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Run Maestro matrix on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu angle_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb logcat -v time > "$GITHUB_WORKSPACE/maestro-live.logcat" 2>&1 &
            adb install -r -d mobile/app-e2e.apk
            curl -fsSL "https://github.com/mobile-dev-inc/maestro/releases/latest/download/maestro.zip" -o /tmp/maestro.zip
            unzip -q -o /tmp/maestro.zip -d "$HOME/.maestro"
            chmod +x "$HOME"/.maestro/maestro/bin/*
            adb shell settings put secure show_ime_with_hard_keyboard 0
            for i in 1 2 3; do if timeout -k 10 300 env MAESTRO_CLI_NO_ANALYTICS=1 "$HOME/.maestro/maestro/bin/maestro" test --debug-output "$GITHUB_WORKSPACE/smoke-debug" mobile/.maestro/smoke.yaml; then break; fi; if [ "$i" = "3" ]; then adb logcat -d > "$GITHUB_WORKSPACE/maestro-logcat.log"; exit 1; fi; sleep 10; done
            bash mobile/.maestro/run-matrix.sh

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-diagnostics-${{ matrix.shard }}
          path: |
            maestro-logcat.log
            maestro-live.logcat
            smoke-debug/**
            maestro-artifacts/**
          retention-days: 7
          if-no-files-found: ignore
