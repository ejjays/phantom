<svg xmlns="http://www.w3.org/2000/svg" width="450" height="70" viewBox="0 0 450 70">
  <defs>
    <filter id="outline" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="black" flood-opacity="1" result="flood"/>
      <feComposite in="SourceGraphic" in2="flood" operator="over"/>
      <feMorphology operator="dilate" radius="2" result="dilated"/>
      <feComposite in="dilated" in2="SourceGraphic" operator="out"/>
    </filter>
  </defs>
  <text x="225" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#00AAE8" stroke="black" stroke-width="2" paint-order="stroke fill">Cyan Panther</text>
</svg>
