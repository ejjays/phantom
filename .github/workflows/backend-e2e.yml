name: Backend E2E

on:
  workflow_dispatch:
    inputs:
      test_url:
        description: Single URL to probe (empty = full tier matrix)
        required: false
        default: ''
      tier:
        description: Tier to run (solid = gate, all = full)
        required: false
        default: solid
        type: choice
        options: [solid, all]
  pull_request:
    branches: [main]
    paths:
      - 'web/backend/**'
      - 'web/shared/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-e2e.yml'
  push:
    branches: [feat/backend-e2e]
    paths:
      - 'web/backend/**'
      - 'web/shared/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-e2e.yml'
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

concurrency:
  group: backend-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  e2e:
    name: e2e ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.test_url != '' && '[1]' || '[1,2,3]') }}
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TIER_MODE: ${{ inputs.tier || (github.event_name == 'pull_request' && 'solid' || 'all') }}
      DISPATCH_URL: ${{ inputs.test_url || '' }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ inputs.test_url != '' && '1' || '3' }}
      VITEST_INCLUDE_E2E: '1'
      E2E: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install yt-dlp
        run: pip3 install --break-system-packages --upgrade yt-dlp

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup workspace
        uses: ./.github/actions/workspace-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-extractors: 'true'
          build-shared: 'true'

      - name: Typecheck and build
        run: |
          cd web/backend
          npx tsc --noEmit
          npm run build

      - name: Install Playwright chromium (for optional browser smoke)
        run: npx playwright install --with-deps chromium

      - name: Run backend e2e (probe + http)
        working-directory: web/backend
        env:
          LIVE_PROXY: ${{ secrets.LIVE_PROXY }}
          IG_COOKIE: ${{ secrets.EXPO_PUBLIC_IG_COOKIE }}
          EXPO_PUBLIC_IG_COOKIE: ${{ secrets.EXPO_PUBLIC_IG_COOKIE }}
          YT_COOKIE: ${{ secrets.YT_COOKIE }}
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          REDIS_URL: redis://localhost:6379
        run: |
          echo "tier=$TIER_MODE shard=$SHARD_INDEX/$SHARD_TOTAL dispatch=${DISPATCH_URL:-none}"
          npx vitest run tests/e2e --no-coverage --reporter=verbose 2>&1 | tee e2e.log
          EXIT=${PIPESTATUS[0]}
          echo "vitest exit=$EXIT"
          # maestro-style matrix table
          node -e '
          const fs=require("fs");
          const cases=JSON.parse(fs.readFileSync("tests/e2e/cases.json","utf8"));
          const log=fs.readFileSync("e2e.log","utf8");
          const tier=process.env.TIER_MODE||"solid";
          const si=Number(process.env.SHARD_INDEX||0), st=Number(process.env.SHARD_TOTAL||1);
          const filtered=cases.filter((_,i)=> i%st===si%st).filter(c=> tier==="all" ? true : c.tier===tier);
          const single=process.env.DISPATCH_URL||process.env.TEST_URL;
          const list=single? [{id:"custom",tier:"solid",url:single}]: filtered;
          const esc=s=>String(s||"-").replace(/\|/g,"/").replace(/</g,"&lt;").slice(0,48);
          let pass=0, soft=0, fail=0;
          const rows=[];
          for(const c of list){
            const id=c.id;
            const hasProbePass=log.includes(`[probe] ${id} PASS`);
            const hasProbeFail=log.includes(`[probe] ${id} META FAIL`)|| log.includes(`[probe] ${id} FAIL`);
            const hasHttpPass=log.includes(`[http] ${id} PASS`);
            const hasHttpFail=log.includes(`[http] ${id} META FAIL`)|| log.includes(`[http] ${id} FAIL`);
            const hasDlPass=log.includes(`[download] ${id} PASS`);
            const hasDlFail=log.includes(`[download] ${id} FAIL`);
            // soft detection: log contains soft + id
            const softRe=new RegExp(`\\[probe\\] soft ${id}|\\[http\\] soft ${id}|\\[download\\] soft ${id}|soft ${id}.*ignored`,"i");
            const isSoft=softRe.test(log);
            let probe= hasProbePass? "PASS": hasProbeFail? (isSoft?"SOFT FAIL":"FAIL") : "—";
            let http= hasHttpPass? "PASS": hasHttpFail? (isSoft?"SOFT FAIL":"FAIL") : "—";
            let dl= hasDlPass? "PASS": hasDlFail? (isSoft?"SOFT FAIL":"FAIL") : "—";
            // extract title/uploader/fmts from PASS line
            const m=log.match(new RegExp(`\\[${id !== "custom"? "(?:probe|http)":"probe"}\\] ${id} PASS[^\\n]*title="([^"]*)"[^\\n]*uploader="([^"]*)"[^\\n]*fmts=(\\d+)`));
            const title=m? esc(m[1]):"-";
            const up=m? esc(m[2]):"-";
            const fmts=m? m[3]:"-";
            const dlM=log.match(new RegExp(`\\[download\\] ${id} PASS[^\\n]*bytes=(\\d+)`));
            const bytes=dlM? dlM[1]:"-";
            let status="PASS";
            if(hasProbeFail||hasHttpFail||hasDlFail) status=isSoft? "SOFT FAIL":"FAIL";
            if(status==="PASS") pass++; else if(status==="SOFT FAIL") soft++; else fail++;
            const note= hasProbeFail||hasHttpFail? (log.match(new RegExp(`\\[probe\\] ${id} META FAIL: ([^\\n]+)`))||log.match(new RegExp(`\\[http\\] ${id} META FAIL: ([^\\n]+)`))||[])[1]?.slice(0,60) || (hasProbeFail||hasHttpFail?"fail": hasDlFail?"dl fail":"-") : "-";
            rows.push(`| ${status} | ${id} | ${c.tier} | ${probe} | ${http} | ${dl} | ${title} | ${up} | ${fmts} | ${bytes} | ${esc(note)} |`);
          }
          const total=list.length;
          const summary=`## backend e2e (shard ${si}/${st} · tier ${tier})` + `\n\n${pass}/${total} passed · solid failed ${fail} · soft failed ${soft}\n\n| status | platform | tier | probe | http | download | title | uploader | fmts | bytes | note |\n|---|---|---|---|---|---|---|---|---|---|---|\n${rows.join("\n")}\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY||"/dev/null", summary);
          fs.writeFileSync(`e2e-report-${si}.tsv`, rows.join("\n"));
          console.log(summary);
          '  || true
          # raw log (collapsed)
          {
            echo ""
            echo "<details><summary>raw log (first 300 lines)</summary>"
            echo ""
            echo '```'
            sed -n '1,300p' e2e.log
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT

      - name: Upload e2e log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-e2e-log-${{ matrix.shard }}
          path: |
            web/backend/e2e.log
            web/backend/e2e-report-*.tsv
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: "Test Report: Backend E2E ${{ matrix.shard }}"
          path: web/backend/test-results.xml
          reporter: jest-junit
          use-actions-summary: false

  browser-smoke:
    name: browser smoke (Playwright)
    needs: e2e
    if: always() && needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install yt-dlp
        run: pip3 install --break-system-packages --upgrade yt-dlp

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup workspace
        uses: ./.github/actions/workspace-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-extractors: 'true'
          build-shared: 'true'

      - name: Build backend
        run: |
          cd web/backend
          npx tsc --noEmit
          npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke via Playwright against live backend
        working-directory: web/backend
        env:
          BROWSER_E2E: '1'
          VITEST_INCLUDE_E2E: '1'
          E2E: '1'
          BACKEND_URL: http://127.0.0.1:5000
          BROWSER_E2E_URL: https://vimeo.com/76979871
          LIVE_PROXY: ${{ secrets.LIVE_PROXY }}
          IG_COOKIE: ${{ secrets.EXPO_PUBLIC_IG_COOKIE }}
        run: |
          PORT=5000 node --import ./dist/backend/src/instrument.js dist/backend/src/app.js &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/ping >/dev/null 2>&1; then echo "backend ready"; break; fi
            sleep 2
            if ! kill -0 $APP_PID 2>/dev/null; then echo "backend died"; exit 1; fi
          done
          npx vitest run tests/e2e/browser.e2e.test.ts --no-coverage --reporter=verbose
          kill $APP_PID || true

  telegram-notify:
    name: Telegram notify
    needs: [e2e, browser-smoke]
    if: ${{ always() && (needs.e2e.result == 'failure' || needs.browser-smoke.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: backend-e2e-log-*
          merge-multiple: true
          path: logs

      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "telegram secrets not set, skipping"; exit 0; }
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="phantom backend e2e FAILED"$'\n\n'
          for f in logs/*.log; do
            [ -f "$f" ] || continue
            SHARD=$(basename "$f" .log | sed 's/backend-e2e-log-//')
            # new maestro table: | FAIL | vs | SOFT FAIL | — fall back to old META FAIL
            FAILS=$(grep -c '| FAIL |' "$f" 2>/dev/null || true)
            SOFTS=$(grep -c '| SOFT FAIL |' "$f" 2>/dev/null || true)
            PASSES=$(grep -c '| PASS |' "$f" 2>/dev/null || true)
            if [ "$PASSES" -eq 0 ]; then PASSES=$(grep -c ' PASS ' "$f" 2>/dev/null || true); fi
            if [ "$FAILS" -eq 0 ] && [ "$SOFTS" -eq 0 ]; then FAILS=$(grep -c 'META FAIL' "$f" 2>/dev/null || true); fi
            if [ "$FAILS" -gt 0 ]; then
              DETAILS=$(grep -E '\| FAIL \||META FAIL|× ' "$f" | head -5 | sed 's/\x1b\[[0-9;]*m//g')
              TEXT+="shard ${SHARD}: ${PASSES} passed, ${FAILS} solid failed"
              if [ "$SOFTS" -gt 0 ]; then TEXT+=", ${SOFTS} soft ignored"; fi
              TEXT+=$'\n'"${DETAILS}"$'\n\n'
            elif [ "$SOFTS" -gt 0 ]; then
              TEXT+="shard ${SHARD}: ${PASSES} passed ✓ (${SOFTS} soft ignored)"$'\n'
            else
              TEXT+="shard ${SHARD}: ${PASSES} passed ✓"$'\n'
            fi
          done
          TEXT+="${RUN_URL}"
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=${TEXT}"
