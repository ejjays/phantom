appId: com.phantom.app
name: smoke - app boots and home input is ready
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible: "paste your link here"
    timeout: 30000
