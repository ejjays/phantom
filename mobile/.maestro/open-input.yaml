appId: com.phantom.app
name: e2e 1 - launch, onboard, dismiss sheets, focus link input
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "saved in seconds"
    commands:
      - tapOn:
          point: "81%, 88%"
      - tapOn:
          point: "81%, 88%"
      - tapOn:
          point: "81%, 88%"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible: "paste your link here"
    timeout: 30000
- tapOn: "Paste download link"
