name: Republish manifest

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to point the manifest at (e.g. 1.2.22)
        required: true

jobs:
  republish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download release apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ inputs.version }}" --pattern "app-release.apk"
      - name: Publish release + update manifest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: bash scripts/publish-apk.sh app-release.apk "${{ inputs.version }}" "manifest repair"