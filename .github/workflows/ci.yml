name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # weekly live-health sweep: catches fixture URL rot + extractor drift
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: 24
  CACHE_KEY: v3-root

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.before }}
          filters: |
            backend:
              - 'web/backend/**'
              - 'web/shared/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            app:
              - 'web/app/**'
              - 'web/site/**'
              - 'scripts/build-site.sh'
              - 'web/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install yt-dlp
        run: pip3 install --break-system-packages --upgrade yt-dlp

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup workspace
        uses: ./.github/actions/workspace-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-extractors: 'true'
          build-shared: 'true'

      - name: Typecheck, lint, and build
        run: |
          cd web/backend
          npx tsc --noEmit
          npx eslint .
          npm run build

      - name: Run core tests
        run: |
          cd web/backend
          npx vitest run --environment node

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: "Test Report: Backend"
          path: web/backend/test-results.xml
          reporter: jest-junit
          use-actions-summary: false

      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: web/backend/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Store coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: web/backend/coverage
          retention-days: 7
          if-no-files-found: ignore

  test-app:
    name: Test App
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup workspace
        uses: ./.github/actions/workspace-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-shared: 'true'

      - name: Typecheck and lint
        run: |
          cd web/app
          npx tsc --noEmit
          npx eslint .

      - name: Astro check (site)
        run: |
          cd web/site
          npx astro sync
          npx astro check

      - name: Run App Tests
        run: |
          cd web/app
          npx vitest run

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: "Test Report: App"
          path: web/app/test-results.xml
          reporter: jest-junit
          use-actions-summary: false

      - name: Store app test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results
          path: web/app/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

  test-mobile:
    name: Test Mobile
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup workspace
        uses: ./.github/actions/workspace-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-extractors: 'true'

      - name: Typecheck, lint, and test
        run: |
          cd mobile
          npx tsc --noEmit
          npx eslint .
          npx vitest run

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: "Test Report: Mobile"
          path: mobile/test-results.xml
          reporter: jest-junit
          use-actions-summary: false

      - name: Store mobile test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-test-results
          path: mobile/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

  test-mobile-live:
    name: Test Mobile (E2E)
    runs-on: ubuntu-latest
    needs: changes
    # scheduled runs diff against themselves → changes outputs are all false
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'schedule'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup workspace
        uses: ./.github/actions/workspace-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-extractors: 'true'

      - name: Live extractor health checks
        run: |
          cd mobile
          VITEST_INCLUDE_LIVE=1 VITEST_INCLUDE_PROBE=1 npx vitest run tests/live

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: "Test Report: Mobile E2E (live)"
          path: mobile/test-results.xml
          reporter: jest-junit
          use-actions-summary: false

      - name: Store mobile E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-e2e-test-results
          path: mobile/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

  knip:
    name: Knip (unused deps & files)
    runs-on: ubuntu-latest
    # baseline kept green; findings drift slowly so sweep weekly, not per-PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/workspace-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-extractors: 'true'
          build-shared: 'true'

      - name: Knip
        run: npx --no-install knip

  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: [changes, test-app]
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main' && needs.test-app.result == 'success'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ runner.os }}-

      - name: Build and Deploy App
        run: |
          npm ci --ignore-scripts
          (cd web/shared && npm run build)
          VER=$(python3 -c "import json; print(json.load(open('package-lock.json'))['packages']['node_modules/lightningcss']['version'])")
          OXVER=$(python3 -c "import json; print(json.load(open('package-lock.json'))['packages']['node_modules/@tailwindcss/oxide']['version'])")
          RVER=$(python3 -c "import json; print(json.load(open('package-lock.json'))['packages']['node_modules/rolldown']['version'])")
          ACVER=$(python3 -c "import json; print(json.load(open('package-lock.json'))['packages']['node_modules/@astrojs/compiler-binding']['version'])")
          npm install --no-save "lightningcss-linux-x64-gnu@$VER" "@tailwindcss/oxide-linux-x64-gnu@$OXVER" "@rolldown/binding-linux-x64-gnu@$RVER" "@astrojs/compiler-binding-linux-x64-gnu@$ACVER" --ignore-scripts
          bash scripts/build-site.sh
          cp -r web/app/functions web/site/dist/
          npx --yes wrangler@4.93.0 pages deploy web/site/dist --project-name c-phantom --branch main
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Save cache
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
