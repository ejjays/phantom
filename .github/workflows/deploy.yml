name: Mobile Live Health

on:
  schedule:
    - cron: '0 * * * *'  # runs every hour
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: 24
  CACHE_KEY: v3-root

jobs:
  mobile-live-health:
    name: Mobile Live Extractor Health Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ runner.os }}-

      - name: Install dependencies (monorepo root)
        run: npm ci --ignore-scripts

      - name: Build shared extractor package
        run: (cd packages/extractors && npm run build)

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Live extractor health checks
        run: |
          cd mobile
          VITEST_INCLUDE_LIVE=1 npx vitest run tests/live

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: "Test Report: Live Extractor Health"
          path: mobile/test-results.xml
          reporter: jest-junit
          use-actions-summary: false
