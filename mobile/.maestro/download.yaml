appId: com.Phantom.android
name: download - paste url, pick quality, get file
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible: "paste your link here"
    timeout: 30000
- tapOn: "Paste download link"
- inputText: ${TEST_URL}
- hideKeyboard
- tapOn: "Download"
- extendedWaitUntil:
    visible: "Select Output Quality"
    timeout: 90000
- runFlow:
    when:
      visible: "Select quality"
    commands:
      - tapOn: "Select quality"
- tapOn:
    id: "quality-option-0"
- tapOn:
    id: "get-file-btn"
- extendedWaitUntil:
    visible:
      text: "(got it! saved|caught it!|done! the magic|saved! that|download complete|saved safely)"
    timeout: 600000
