name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: 24
  CACHE_KEY: v3-root

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.before }}
          filters: |
            backend:
              - 'web/backend/**'
              - 'web/shared/**'
              - 'packages/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'web/frontend/**'
              - 'web/shared/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'packages/**'
              - '.github/workflows/ci.yml'

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ runner.os }}-

      - name: Install yt-dlp
        run: pip3 install --break-system-packages --upgrade yt-dlp

      - name: Install dependencies (monorepo root)
        run: npm ci --ignore-scripts

      - name: Build shared extractor package
        run: (cd packages/extractors && npm run build)

      - name: Save cache
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Typecheck, lint, and build
        run: |
          cd web/backend
          npx tsc --noEmit
          npx eslint .
          npm run build

      - name: Run core tests
        run: |
          cd web/backend
          npx vitest run --environment node

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: "Test Report: Backend"
          path: web/backend/test-results.xml
          reporter: jest-junit
          use-actions-summary: false

      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: web/backend/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Store coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: web/backend/coverage
          retention-days: 7
          if-no-files-found: ignore

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ runner.os }}-

      - name: Install dependencies (monorepo root)
        run: npm ci --ignore-scripts

      - name: Save cache
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Typecheck and lint
        run: |
          cd web/frontend
          npx tsc --noEmit
          npx eslint .

      - name: Run Frontend Tests
        run: |
          cd web/frontend
          npx vitest run

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: "Test Report: Frontend"
          path: web/frontend/test-results.xml
          reporter: jest-junit
          use-actions-summary: false

      - name: Store frontend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: web/frontend/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

  test-mobile:
    name: Test Mobile
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ runner.os }}-

      - name: Install dependencies (monorepo root)
        run: npm ci --ignore-scripts

      - name: Build shared extractor package
        run: (cd packages/extractors && npm run build)

      - name: Save cache
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Typecheck, lint, and test
        run: |
          cd mobile
          npx tsc --noEmit
          npx eslint .
          npx vitest run

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: "Test Report: Mobile"
          path: mobile/test-results.xml
          reporter: jest-junit
          use-actions-summary: false

      - name: Store mobile test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-test-results
          path: mobile/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

  test-mobile-live:
    name: Test Mobile (E2E)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ runner.os }}-

      - name: Install dependencies (monorepo root)
        run: npm ci --ignore-scripts

      - name: Build shared extractor package
        run: (cd packages/extractors && npm run build)

      - name: Live extractor health checks
        run: |
          cd mobile
          VITEST_INCLUDE_LIVE=1 npx vitest run tests/live

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: "Test Report: Mobile E2E (live)"
          path: mobile/test-results.xml
          reporter: jest-junit
          use-actions-summary: false

      - name: Store mobile E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-e2e-test-results
          path: mobile/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [changes, test-frontend]
    if: github.ref == 'refs/heads/main' && needs.test-frontend.result == 'success'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ runner.os }}-

      - name: Build and Deploy Frontend
        run: |
          npm ci --ignore-scripts
          VER=$(python3 -c "import json; print(json.load(open('package-lock.json'))['packages']['node_modules/lightningcss']['version'])")
          OXVER=$(python3 -c "import json; print(json.load(open('package-lock.json'))['packages']['node_modules/@tailwindcss/oxide']['version'])")
          RVER=$(python3 -c "import json; print(json.load(open('package-lock.json'))['packages']['node_modules/@rolldown/binding']['version'])")
          npm install --no-save "lightningcss-linux-x64-gnu@$VER" "@tailwindcss/oxide-linux-x64-gnu@$OXVER" "@rolldown/binding-linux-x64-gnu@$RVER" --ignore-scripts
          cd web/frontend
          npm run build
          rm -rf dist/ffmpeg-core dist/libav
          cp -r functions dist/
          npx --yes wrangler@4.93.0 pages deploy dist --project-name c-phantom --branch main
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Save cache
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
