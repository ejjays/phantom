name: Workspace Setup
description:
  Guard bindings, install deps (scripts off), optionally build internal
  packages, cache node_modules
inputs:
  node-version:
    description: Node version for setup-node
    required: true
  build-extractors:
    description: Build packages/extractors after install
    required: false
    default: 'false'
  build-shared:
    description: Build web/shared after install
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Guard against platform-pinned bindings
      run: bash scripts/guard-platform-bindings.sh
      shell: bash

    - name: Restore cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: v3-root-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: v3-root-${{ runner.os }}-

    - name: Install dependencies (monorepo root)
      run: npm ci --ignore-scripts
      shell: bash

    - name: Build internal packages
      if: inputs.build-extractors == 'true' || inputs.build-shared == 'true'
      run: |
        ${{ inputs.build-extractors == 'true' && '(cd packages/extractors && npm run build)' || '' }}
        ${{ inputs.build-shared == 'true' && '(cd web/shared && npm run build)' || '' }}
      shell: bash

    - name: Save cache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: node_modules
        key: v3-root-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
