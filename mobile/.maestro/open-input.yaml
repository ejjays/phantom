appId: com.phantom.app
name: e2e 1 - launch, onboard, dismiss sheets, focus link input
---
- runFlow:
    when:
      visible: "Any video or song, saved in seconds"
    commands:
      - tapOn: "Get Started"
      - tapOn: "Get Started"
      - tapOn: "Get Started"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible: "paste your link here"
    timeout: 30000
- tapOn: "Paste download link"
