<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" width="1400" height="460" version="1.1">
  <defs>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      @keyframes shadow-pulse {
        0%, 100% { transform: scale(1); opacity: 0.2; }
        50% { transform: scale(0.82); opacity: 0.1; }
      }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
      }
      @keyframes minimal-mouth {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.04, 0.96); }
      }
      @keyframes mouth-morph {
        0%, 8.62% {
          d: path("M 187 218 Q 200 225 213 218 Q 200 219 187 218 Z");
        }
        11.21% {
          d: path("M 186 213 Q 200 237 214 213 Q 200 207 186 213 Z");
        }
        97.41% {
          d: path("M 186 213 Q 200 237 214 213 Q 200 207 186 213 Z");
        }
        100% {
          d: path("M 187 218 Q 200 225 213 218 Q 200 219 187 218 Z");
        }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.7; }
      }
      .ghost-body {
        animation: float 3.2s ease-in-out infinite;
      }
      .ghost-ground-shadow {
        animation: shadow-pulse 3.2s ease-in-out infinite;
        transform-origin: 200px 385px;
      }
      .ghost-eyes {
        animation: blink 4.2s infinite;
        transform-origin: 200px 180px;
      }
      .ghost-mouth {
        animation: minimal-mouth 3.2s ease-in-out infinite;
        transform-origin: 200px 220px;
      }
      .ghost-mouth-morph {
        animation: mouth-morph 11.6s ease-in-out 2s infinite backwards;
      }
      .star-1 { animation: twinkle 3.1s ease-in-out infinite; }
      .star-2 { animation: twinkle 4.3s ease-in-out infinite 0.8s; }
      .star-3 { animation: twinkle 3.7s ease-in-out infinite 1.4s; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="55%" stop-color="#0a0a2a"/>
      <stop offset="100%" stop-color="#030014"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="title-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#06B6D4" flood-opacity="0.55"/>
    </filter>
    <filter id="ghost-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="ghost-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="460" fill="url(#bg)"/>
  <ellipse cx="330" cy="230" rx="430" ry="300" fill="url(#glow)"/>

  <circle class="star-1" cx="620" cy="90" r="2.5" fill="#67E8F9"/>
  <circle class="star-2" cx="1290" cy="150" r="2" fill="#22d3ee"/>
  <circle class="star-3" cx="1140" cy="70" r="2.5" fill="#67E8F9"/>
  <circle class="star-2" cx="700" cy="380" r="2" fill="#22d3ee"/>
  <circle class="star-3" cx="1350" cy="330" r="2.5" fill="#67E8F9"/>
  <circle class="star-1" cx="880" cy="120" r="1.8" fill="#22d3ee"/>

  <g transform="translate(90,15)">
    <ellipse class="ghost-ground-shadow" cx="200" cy="385" rx="75" ry="10" fill="#083344" opacity="0.2"/>
    <g class="ghost-body" filter="url(#ghost-shadow)">
      <path d="M 80 170 C 80 103.7, 133.7 50, 200 50 C 266.3 50, 320 103.7, 320 170 L 320 330 Q 290 352, 260 330 Q 230 352, 200 330 Q 170 352, 140 330 Q 110 352, 80 330 Z" fill="url(#ghost-body-grad)"/>
      <path d="M 285 105 C 305 140, 320 220, 320 330 Q 290 352, 260 330 Q 250 322, 245 310 C 270 270, 280 180, 285 105 Z" fill="#0891B2" opacity="0.4"/>
      <g class="ghost-eyes">
        <ellipse cx="165" cy="180" rx="13" ry="18" fill="#083344"/>
        <ellipse cx="168" cy="175" rx="5" ry="7" fill="#FFFFFF"/>
        <ellipse cx="235" cy="180" rx="13" ry="18" fill="#083344"/>
        <ellipse cx="238" cy="175" rx="5" ry="7" fill="#FFFFFF"/>
      </g>
      <ellipse cx="148" cy="197" rx="9" ry="5" fill="#0891B2" opacity="0.6"/>
      <ellipse cx="252" cy="197" rx="9" ry="5" fill="#0891B2" opacity="0.6"/>
      <g class="ghost-mouth">
        <path class="ghost-mouth-morph" d="M 187 218 Q 200 225 213 218 Q 200 219 187 218 Z" fill="#083344"/>
      </g>
    </g>
  </g>

  <text x="530" y="225" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="900" fill="url(#title-grad)" filter="url(#title-glow)">Cyan Phantom</text>
  <text x="534" y="286" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" letter-spacing="6" fill="#22d3ee">MEDIA ORCHESTRATION ENGINE</text>
  <text x="534" y="336" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="1" fill="#7dd3fc">Download · Mux · Save — fully on-device</text>
</svg>
